{% extends 'layout.html' %}
{% load static %}

{% block extrahead %}
    <meta charset="UTF-8">
    <title>Spinning Wheel</title>
    <link rel="stylesheet" href="{% static 'lootboxes/css/wheel.css' %}">
    <link rel="stylesheet" href="{% static 'css/styleAll.css' %}">
{% endblock %}

{% block content %}
    <h1 style="text-align: center;">Spinning Wheel</h1>

    <div id="petbucks-display">
        Pet Bucks: <span id="petbucks">{{ pet_bucks }}</span>
    </div>

    <div id="wheel-container">
        <canvas id="wheel"></canvas>
    </div>

    <div id="result-message"></div>

    <div id="win-message"></div>
    {# Hold django scripting vars here so js can use them too #}
    <script>
        window.wheelOptions = {{ options|safe }};
        window.spinWheelUrl = "{% url 'lootboxes:spin_wheel' %}";
    </script>

    <script src="{% static 'lootboxes/js/wheel.js' %}"></script>
{% endblock %}
