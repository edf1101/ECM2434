{% extends 'layout.html' %}
{% load static %}

{% block title %}EcoPet - Loot Box Spin{% endblock %}

{% block extrahead %}
  <link rel="stylesheet" href="{% static 'css/styleAll.css' %}">
  <style>
    /* Container for the canvas wheel */
    #wheelContainer {
      width: 300px;
      height: 300px;
      margin: 20px auto;
      border: 2px solid red; /* Debug border - remove if desired */
    }
    /* Canvas element styling */
    #wheel {
      width: 300px;
      height: 300px;
      display: block;
    }
    /* Simple spin button styling */
    #spinButton {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      font-size: 1.2em;
      background: #228B22;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    /* Result message styling */
    #resultMessage {
      margin-top: 20px;
      font-size: 1.3em;
      text-align: center;
    }
  </style>
{% endblock %}

{% block content %}
  <h1 class="text-center">Loot Box Spin 🎉</h1>
  <p class="text-center">Your current pet bucks: <strong>{{ profile.pet_bucks }}</strong></p>
  
  <!-- Optional backend spin form (if needed) -->
  <div class="spin-container text-center mb-4">
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn" style="background-color: #228B22; color: white;">
        Spin the Wheel for 5 Bucks
      </button>
    </form>
  </div>
  
  <!-- Canvas Wheel Container -->
  <div id="wheelContainer">
    <canvas id="wheel" width="300" height="300"></canvas>
  </div>
  <button id="spinButton">SPIN</button>
  <div id="resultMessage" class="text-center"></div>
{% endblock %}

{% block extrafoot %}
<script>
document.addEventListener("DOMContentLoaded", function() {
  console.log("DEBUG: DOM fully loaded.");

  // Get the canvas element and its 2D context
  const canvas = document.getElementById("wheel");
  if (!canvas) {
    console.error("DEBUG: Canvas element not found!");
    return;
  }
  const ctx = canvas.getContext("2d");
  if (!ctx) {
    console.error("DEBUG: 2D context not obtained!");
    return;
  }
  console.log("DEBUG: Canvas and context obtained:", canvas, ctx);

  // Define six sectors for the wheel
  const sectors = [
    { color: "#f82", label: "nothing" },
    { color: "#e91e63", label: "nothing" },
    { color: "#9c27b0", label: "+100 bucks" },
    { color: "#3f51b5", label: "+100 points" },
    { color: "#03a9f4", label: "-50 bucks" },
    { color: "#4caf50", label: "lose all points :(" }
  ];
  const tot = sectors.length;
  const dia = canvas.width;  // 300
  const rad = dia / 2;       // 150
  const PI = Math.PI;
  const TAU = 2 * PI;
  const arc = TAU / tot;     // 60° per sector

  // Draw the wheel on the canvas (with sectors, outlines, and labels)
  function drawWheel(rotationAngle) {
    ctx.clearRect(0, 0, dia, dia);
    for (let i = 0; i < tot; i++) {
      const startAngle = i * arc + rotationAngle;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(rad, rad);
      ctx.arc(rad, rad, rad, startAngle, startAngle + arc);
      ctx.closePath();
      ctx.fillStyle = sectors[i].color;
      ctx.fill();
      // Draw white outline
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.stroke();
      // Draw label centered in sector
      ctx.translate(rad, rad);
      ctx.rotate(startAngle + arc/2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#fff";
      ctx.font = "bold 16px sans-serif";
      ctx.fillText(sectors[i].label, rad - 10, 10);
      ctx.restore();
    }
  }

  // Initial wheel draw with no rotation
  let currentAngle = 0;
  drawWheel(currentAngle);
  console.log("DEBUG: Wheel drawn on canvas.");

  // Variables for spin animation
  let isSpinning = false;
  let spinStartTime = null;
  const spinDuration = 4000; // 4 seconds spin duration
  let spinTotalAngle = 0;    // Total angle (radians) for spin

  // Animate the spin using requestAnimationFrame
  function animateSpin(timestamp) {
    if (!spinStartTime) spinStartTime = timestamp;
    const progress = timestamp - spinStartTime;
    let fraction = progress / spinDuration;
    if (fraction > 1) fraction = 1;
    // Ease-out cubic easing
    const easeOut = 1 - Math.pow(1 - fraction, 3);
    const angle = currentAngle + spinTotalAngle * easeOut;
    drawWheel(angle);
    if (progress < spinDuration) {
      requestAnimationFrame(animateSpin);
    } else {
      currentAngle = (currentAngle + spinTotalAngle) % TAU;
      // Adjust final angle so that 0 is at the top
      let finalAngle = (currentAngle + PI/2) % TAU;
      const sectorIndex = Math.floor(finalAngle / arc);
      const outcome = sectors[sectorIndex].label;
      document.getElementById("resultMessage").innerHTML =
        "<p>🎁 You landed on: <strong>" + outcome + "</strong>! 🎉</p>";
      isSpinning = false;
      spinStartTime = null;
    }
  }

  // Spin button click event handler
  const spinButton = document.getElementById("spinButton");
  spinButton.addEventListener("click", function() {
    if (isSpinning) return;
    isSpinning = true;
    // Calculate a random spin: at least 2 full rotations plus an extra random rotation
    spinTotalAngle = (2 * TAU) + (Math.random() * TAU);
    document.getElementById("resultMessage").innerHTML = "";
    requestAnimationFrame(animateSpin);
  });

  console.log("DEBUG: Spin functionality initialized.");
});
</script>
{% endblock %}
